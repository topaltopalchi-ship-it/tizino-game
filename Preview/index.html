<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143c63"><title>پیش‌نمایش تیزینو — نجات پل جنگل</title>
<style>
:root{--navy:#143c63;--blue:#2677d9;--paper:#fffdf6}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(#c6edff,#f6fbff 42%,#e8f7d9);color:var(--navy);min-height:100vh}header{padding:16px;text-align:center;background:var(--navy);color:white}header h1{margin:0;font-size:clamp(1.3rem,4vw,2rem)}header p{margin:7px 0 0;color:#d7edff}main{max-width:900px;margin:auto;padding:16px;display:grid;gap:14px}.scene{position:relative;min-height:230px;overflow:hidden;border:3px solid white;border-radius:22px;background:linear-gradient(#87d6ff 0 55%,#b6e58b 55%);box-shadow:0 8px 24px #143c631a}.sun{position:absolute;top:18px;left:8%;width:48px;height:48px;border-radius:50%;background:#ffe17a;box-shadow:0 0 0 10px #ffe17a45}.cloud{position:absolute;top:42px;right:12%;font-size:2.4rem}.hill{position:absolute;bottom:60px;width:70%;height:115px;background:#72bd70;border-radius:50% 50% 0 0}.hill.left{left:-20%}.hill.right{right:-20%;background:#58a85f}.river{position:absolute;bottom:0;left:0;right:0;height:78px;background:linear-gradient(#55c7ed,#268fc9)}.bridge{position:absolute;bottom:55px;left:19%;right:19%;display:flex;gap:5px;justify-content:center}.plank{height:27px;flex:1;max-width:115px;border:2px solid #9b5a24;border-radius:5px;background:#d9964c;box-shadow:0 3px 0 #9b5a24;opacity:.35;transition:opacity .25s,transform .25s}.plank.done{opacity:1;background:#ffcc6d;transform:translateY(-5px)}.mascot{position:absolute;bottom:78px;left:7%;font-size:clamp(2.6rem,8vw,4.5rem)}.scene-label{position:absolute;top:12px;left:12px;background:#ffffffd9;border-radius:12px;padding:7px 10px;font-size:.78rem;font-weight:bold}.panel{background:var(--paper);border:1px solid #d6e7f5;border-radius:20px;padding:18px;box-shadow:0 7px 20px #143c6310}.progress-row{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:bold}.track{height:10px;flex:1;background:#e2edf6;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#24b78c,#1686d0);transition:width .3s}h2{font-size:clamp(1.05rem,3vw,1.35rem);line-height:1.8;margin:14px 0;text-align:center}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}button{font:inherit;cursor:pointer;touch-action:manipulation}.answer{min-height:58px;border:2px solid #d7e7f5;border-radius:14px;background:white;color:var(--navy);font-weight:bold;padding:10px}.answer:hover{border-color:var(--blue)}.answer:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #f0a51a;outline-offset:3px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}.answer:disabled{cursor:default;opacity:.75}.feedback{min-height:48px;margin:12px 0 0;text-align:center;line-height:1.8;font-weight:bold;color:#167d61}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}.primary,.secondary{border-radius:13px;padding:12px 18px;font-weight:bold}.primary{background:var(--blue);color:white}.secondary{background:#eaf3fb;color:var(--navy)}.foot{text-align:center;font-size:.8rem;color:#47677f;padding:0 10px 16px}@media(max-width:520px){main{padding:10px}.scene{min-height:200px}.panel{padding:14px}.answers{grid-template-columns:1fr}.answer{min-height:48px}.bridge{left:22%;right:22%}.plank{height:22px}}
</style></head><body>
<header><h1>✨ تیزینو و جزیرهٔ ستاره‌ها</h1><p>پیش‌نمایش قابل‌بازی — مرحلهٔ ۱: نجات پل جنگل</p></header>
<main><section class="scene" aria-label="محیط نمایشی پل جنگل"><div class="sun"></div><div class="cloud">☁️</div><div class="hill left"></div><div class="hill right"></div><div class="river"></div><div class="bridge" id="bridge"><span class="plank"></span><span class="plank"></span><span class="plank"></span><span class="plank"></span></div><div class="mascot" aria-label="تیزینو">🧙‍♂️</div><div class="scene-label">🌳 جنگل جادویی</div><div class="scene-label" style="top:auto;bottom:10px;left:10px;background:#ffffffdf">🌉 تخته‌های پل: <span id="bridgeCount">۰</span>/۴</div></section>
<section class="panel"><div class="progress-row"><span id="step"></span><div class="track"><div class="fill" id="fill"></div></div><span>⭐ <b id="stars">۰</b></span></div><h2 id="prompt"></h2><div class="answers" id="answers"></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><div class="actions"><button class="secondary" id="repeat" type="button">🔁 تکرار سؤال</button><button class="primary" id="restart" type="button">از اول بازی کن</button></div></section></main>
<p class="foot">این پیش‌نمایش وبی برای بررسی زودهنگام سؤال‌ها و ظاهر است؛ نسخهٔ سه‌بعدی نهایی در Unity ساخته می‌شود.</p>
<script>
const questions=[
{p:"قرمز، آبی، قرمز، آبی؛ بعدی کدام است؟",o:["قرمز","سبز","زرد"],a:0,e:"آفرین! الگو یکی در میان تکرار می‌شود."},
{p:"دایره، دایره، ستاره، دایره، دایره؛ بعدی کدام است؟",o:["ستاره","مربع","دایره"],a:0,e:"در این الگو دو دایره و بعد یک ستاره داریم."},
{p:"۱، ۲، ۳؛ بعدی کدام عدد است؟",o:["۴","۵","۲"],a:0,e:"درست است! هر بار یک عدد اضافه می‌شود."},
{p:"کدام مورد با بقیه فرق دارد؟",o:["سیب","گلابی","صندلی"],a:2,e:"آفرین! صندلی وسیله است و بقیه میوه‌اند."}];
let index=0,stars=0,locked=false;const $=id=>document.getElementById(id);
function fa(n){return String(n).replace(/[0-9]/g,d=>"۰۱۲۳۴۵۶۷۸۹"[Number(d)])}
function render(){locked=false;$("step").textContent=index<questions.length?"سؤال "+fa(index+1)+" از "+fa(questions.length):"پایان مرحله";$("fill").style.width=(index/questions.length*100)+"%";$("stars").textContent=fa(stars);const q=questions[index];if(!q){$("prompt").textContent="🎉 آفرین! پل جنگل نجات پیدا کرد!";$("answers").replaceChildren();$("feedback").textContent=fa(stars)+" ستاره از "+fa(questions.length)+" ستاره گرفتی. دوباره بازی کن!";return}$("prompt").textContent=q.p;$("feedback").textContent="بهترین پاسخ را انتخاب کن.";$("answers").replaceChildren();q.o.forEach((option,i)=>{const b=document.createElement("button");b.className="answer";b.type="button";b.textContent=option;b.addEventListener("click",()=>choose(i));$("answers").appendChild(b)});document.querySelectorAll(".plank").forEach((p,i)=>p.classList.toggle("done",i<stars));$("bridgeCount").textContent=fa(stars)}
function choose(choice){if(locked||index>=questions.length)return;const q=questions[index];locked=true;document.querySelectorAll(".answer").forEach(b=>b.disabled=true);if(choice===q.a){stars++;$("feedback").textContent=q.e;document.querySelectorAll(".plank")[Math.min(stars-1,3)].classList.add("done");$("stars").textContent=fa(stars);setTimeout(()=>{index++;render()},1100)}else{$("feedback").textContent="نزدیک بود! کمی دیگر فکر کن و دوباره تلاش کن.";setTimeout(()=>{locked=false;document.querySelectorAll(".answer").forEach(b=>b.disabled=false);$("feedback").textContent="این بار یک گزینهٔ دیگر را امتحان کن."},1100)}}
$("repeat").addEventListener("click",()=>{if(index<questions.length)$("feedback").textContent="🔊 "+questions[index].p+" (در این پیش‌نمایش صدا پخش نمی‌شود.)"});$("restart").addEventListener("click",()=>{index=0;stars=0;render()});render();
</script></body></html>
