name: Deploy playable grade preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble minimal preview site
        run: |
          mkdir -p site/Preview site/Assets/_Tiizino/Resources
          cp Preview/grades.html site/Preview/grades.html
          cp Assets/_Tiizino/Resources/Grade1_QuestionBank.json site/Assets/_Tiizino/Resources/
          cp Assets/_Tiizino/Resources/Grade2_QuestionBank.json site/Assets/_Tiizino/Resources/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=Preview/grades.html">
            <title>تیزینو — پیش‌نمایش بازی</title>
          </head>
          <body>
            <p><a href="Preview/grades.html">شروع پیش‌نمایش بازی تیزینو</a></p>
          </body>
          </html>
          EOF
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
