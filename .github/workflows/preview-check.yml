name: Preview smoke check

on:
  push:
    paths:
      - "Preview/**"
      - "Tests/**"
      - "Docs/**"
      - "Assets/_Tiizino/Data/Questions/**"
      - "Assets/_Tiizino/Resources/**"
      - "Assets/_Tiizino/Scripts/Gameplay/**"
      - "Assets/Editor/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/preview-check.yml"
  pull_request:
    paths:
      - "Preview/**"
      - "Tests/**"
      - "Assets/_Tiizino/Data/Questions/**"
      - "Assets/_Tiizino/Resources/**"
      - "Assets/_Tiizino/Scripts/Gameplay/**"
      - "Assets/Editor/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/preview-check.yml"

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run preview smoke checks
        run: node Tests/preview-smoke-test.mjs
      - name: Validate grade question banks
        run: node Tests/question-bank-test.mjs
